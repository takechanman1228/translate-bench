[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "translate-bench"
version = "1.0.0"
description = "A reproducible benchmark for translation quality, speed, and memory across local models and cloud services"
readme = "README.md"
requires-python = ">=3.11,<3.13"  # numpy 1.26.4 has no wheels for Python 3.13
license = "Apache-2.0"
authors = [{ name = "takechanman1228" }]
dependencies = ["numpy==1.26.4", "sacrebleu==2.5.1"]

[project.optional-dependencies]
# setuptools: the torchmetrics that unbabel-comet 2.2.7 installs imports pkg_resources, absent from a fresh venv.
comet = ["unbabel-comet==2.2.7", "torch==2.8.0", "transformers==4.50.3", "huggingface-hub==0.36.2",
         "sentencepiece==0.2.3", "setuptools<81"]
metricx = ["torch==2.8.0", "transformers==4.50.3", "huggingface-hub==0.36.2", "sentencepiece==0.2.3"]
figures = ["matplotlib==3.10.8"]
dev = ["ruff==0.14.4"]

[project.urls]
Repository = "https://github.com/takechanman1228/translate-bench"

[project.scripts]
translate-bench = "translate_bench.cli:entry"

[tool.setuptools.packages.find]
include = ["translate_bench*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
