name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check --no-cache translate_bench tests tools
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Public-tree check, including every commit and blob in the history
        run: python tools/check_public_tree.py --history
      - name: Verify the published numbers
        env:
          OPENBLAS_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
        run: translate-bench verify
      - name: Validate submitted systems
        run: |
          shopt -s nullglob
          for folder in submissions/*/; do translate-bench validate-submission "$folder"; done
      - name: README numbers and site data match the results
        env:
          OPENBLAS_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
        run: |
          python -m translate_bench.export.readme --check
          python -m translate_bench.export.site_data --check
