name: pages
# Publishes site/ (the leaderboard and dashboard) to GitHub Pages. The page has no build step;
# the job only checks that site/data.js matches results/v1 before uploading the folder.
on:
  push:
    branches: [main]
    paths: ["site/**", "results/**", "configs/**", "translate_bench/export/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Site data matches the results
        env:
          OPENBLAS_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
        run: python -m translate_bench.export.site_data --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
